server:
  port: 8080

logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

redis:
  server:
    urls: redis//localhost:6379

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/redis-cache}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false